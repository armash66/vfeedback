services:
  db:
    image: postgres:16-alpine
    container_name: vfeedback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfeedback}
      POSTGRES_DB: ${POSTGRES_DB:-vfeedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vfeedback} -d $${POSTGRES_DB:-vfeedback}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: vfeedback_postgres_data
